name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: true

      - run: vp install --frozen-lockfile --ignore-scripts

      - run: vp check

      - run: vp test run

      - run: vp pack

      - run: vp run check:package

      - run: vp run test:package

      - name: Check bundle size budget
        run: |
          size=$(gzip -c dist/index.mjs | wc -c | tr -d ' ')
          echo "dist/index.mjs gzipped: ${size} bytes (budget: 1024)"
          test "$size" -le 1024
