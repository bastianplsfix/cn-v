name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: true

      - run: vp install --frozen-lockfile --ignore-scripts

      - run: vp check

      - run: vp test run

      - run: vp pack

      - run: vp run check:package

      - run: vp run test:package

      - name: Check bundle size budget
        run: |
          size=$(gzip -c dist/index.mjs | wc -c | tr -d ' ')
          echo "dist/index.mjs gzipped: ${size} bytes (budget: 1024)"
          test "$size" -le 1024
