name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: 24
          cache: true

      - run: vp install --frozen-lockfile --ignore-scripts

      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"

      - run: vp check

      - run: vp test run

      - run: vp pack

      - run: vp run check:package

      - run: vp run test:package

      - run: vp pm publish --provenance --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version" '$0 == heading {found=1; next} /^## / {found=0} found' CHANGELOG.md > /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
