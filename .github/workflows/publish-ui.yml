name: Publish UI

on:
  push:
    tags: ["ui-v*"]

concurrency:
  group: publish-ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          version: 0.2.5
          node-version: 24
          cache: true

      - name: Verify tag and prepare release notes
        run: |
          test "$GITHUB_REF_NAME" = "ui-v$(node -p 'require("./packages/ui/package.json").version')"
          version="${GITHUB_REF_NAME#ui-v}"
          awk -v heading="## $version" '$0 == heading {found=1; next} /^## / {found=0} found' packages/ui/CHANGELOG.md > "$RUNNER_TEMP/ui-notes.md"
          test -s "$RUNNER_TEMP/ui-notes.md"

      - run: vp install --frozen-lockfile --ignore-scripts
      - run: vp check
      - run: vp test run
      - run: vp run @cn-variants/ui#check
      - run: vp run build:ui
      - run: vp exec publint packages/ui
      - run: vp exec playwright install --with-deps chromium

      - name: Test UI tarball against published dependencies
        run: node scripts/ui-smoke.mjs --published-core

      - name: Publish UI to npm
        run: |
          version="${GITHUB_REF_NAME#ui-v}"
          dist_tag=latest
          if [[ "$version" == *-* ]]; then dist_tag=next; fi
          vp pm publish --filter @cn-variants/ui --access public --provenance --tag "$dist_tag"

      - name: Create UI GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=()
          if [[ "${GITHUB_REF_NAME#ui-v}" == *-* ]]; then release_args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --title "@cn-variants/ui ${GITHUB_REF_NAME#ui-v}" --notes-file "$RUNNER_TEMP/ui-notes.md" --latest=false "${release_args[@]}"
